[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reporium-security"
version = "0.1.0"
description = "Security scanning tool for Reporium repos — secrets, CVEs, workflows, files, history"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
reporium-security = "reporium_security.__main__:main"

[tool.setuptools.packages.find]
include = ["reporium_security*"]
exclude = ["security*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
