name: CI

# Clean workflow: SHA-pinned action, least-privilege permissions, safe trigger.
# Lets the workflows check pass so the grade is driven by the dependency CVE.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: echo "build"
