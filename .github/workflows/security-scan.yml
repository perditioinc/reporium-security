name: Security Scan

on:
  workflow_call:
    inputs:
      repo:
        description: "Repository to scan (org/repo format)"
        required: false
        type: string
        default: ""
    outputs:
      grade:
        description: "Security grade (A-F)"
        value: ${{ jobs.scan.outputs.grade }}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    outputs:
      grade: ${{ steps.scan.outputs.grade }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install reporium-security
        run: pip install git+https://github.com/perditioinc/reporium-security.git

      - name: Run security scan
        id: scan
        run: |
          if [ -n "${{ inputs.repo }}" ]; then
            python -m reporium_security scan "${{ inputs.repo }}" --output SECURITY_REPORT.md
          else
            python -m reporium_security scan . --output SECURITY_REPORT.md
          fi
          GRADE=$(grep "Security Grade:" SECURITY_REPORT.md | head -1 | sed 's/.*Grade: \([A-F]\).*/\1/')
          echo "grade=$GRADE" >> "$GITHUB_OUTPUT"

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-report
          path: SECURITY_REPORT.md
